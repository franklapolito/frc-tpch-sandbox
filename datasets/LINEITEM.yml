  - name: L_SHIPINSTRUCT
    data_type: string
  - name: L_SHIPMODE
    data_type: string
  - name: L_COMMENT
    data_type: string
  - name: Net Price (After Discount)
    data_type: decimal(25,4)
    sql: L_EXTENDEDPRICE * (1 - L_DISCOUNT)
  - name: Final Price (After Tax & Discount)
    data_type: decimal(38,6)
    sql: L_EXTENDEDPRICE * (1 - L_DISCOUNT) * (1 + L_TAX)
