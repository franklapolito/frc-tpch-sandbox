  - name: L_QUANTITY
    data_type: decimal(12,2)
  - name: L_EXTENDEDPRICE
    data_type: decimal(12,2)
  - name: L_DISCOUNT
    data_type: decimal(12,2)
  - name: L_TAX
    data_type: decimal(12,2)
  - name: L_RETURNFLAG
    data_type: string
  - name: L_LINESTATUS
    data_type: string
  - name: L_SHIPDATE
    data_type: date
  - name: L_COMMITDATE
    data_type: date
  - name: L_RECEIPTDATE
